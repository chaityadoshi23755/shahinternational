<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet the loyal and expert team at Shah International, providing region-wise one-to-one connection for our customers.">
  <title>Our Team | Shah International</title>
  <link rel="shortcut icon" href="sites/default/files/favicon_v3_2024_0.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=1784915559">
</head>
<body>
  <!-- Shared Header -->
  <div id="shared-header"></div>
<!-- Shared Header -->
  

  <!-- Page Banner -->
  <section class="page-banner">
    <img src="sites/default/files/2018-12/about.jpg" alt="Our Team" class="page-banner-bg" style="filter: sepia(0.5) hue-rotate(180deg);">
    <div class="page-banner-overlay" style="background: rgba(10,20,30,0.7);"></div>
    <div class="page-banner-content">
      <h1>Our Team</h1>
      <ol class="breadcrumb">
        <li><a href="index.html"><i class="fa-solid fa-house" style="font-size: 0.9em;"></i></a></li>
        <li><span style="color: rgba(255,255,255,0.7); margin: 0 10px;">/</span> Company</li>
        <li><span style="color: rgba(255,255,255,0.7); margin: 0 10px;">/</span> Our Team</li>
      </ol>
    </div>
  </section>

  

  <!-- Team Carousel Section (TrueNorth Style) -->
  <section class="section team-carousel-section" style="background-color: var(--color-bg); padding: 5rem 0; overflow: hidden; position: relative;">
    <div class="container">
      
      <div class="text-center mb-xl reveal">
        <h2 class="section-heading" style="color: var(--color-brand-red);">The Pillars of Our Success</h2>
        <p class="section-subheading" style="max-width: 800px; margin: 0 auto;">Dedicated experts delivering a one-to-one touch, anywhere in the country.</p>
      </div>

      <div class="people-carousel-container reveal reveal-delay-1">
        
        <!-- Left: Active Member (Large) -->
        <div class="people-active-card">
          <div class="people-active-photo-wrapper">
             <!-- SVG Animated rotating dashed circle -->
             <svg class="active-photo-ring" viewBox="0 0 100 100">
               <circle cx="50" cy="50" r="49" fill="none" stroke="var(--color-brand-red)" stroke-width="0.5" stroke-dasharray="2 4" />
             </svg>
             
             
             <div class="people-active-photo" id="active-person-photo">
                <!-- Image or Initial Placeholder -->
             </div>
          </div>
          <div class="people-active-info" id="active-person-info">
             <h3 class="active-name">Kirti Shah</h3>
             <p class="active-title">Founder & Managing Director</p>
          </div>
        </div>

        <!-- Right: Inactive Members List (Small) -->
        <div class="people-inactive-list">
          <div class="people-track-wrapper">
              <div class="people-track" id="people-track">
                 
                 <div class="people-thumbnail " data-index="" onclick="selectTeamMember()">
                     <div class="avatar-placeholder" style="background-color: #f8f9fa; color: var(--color-brand-red);">
                         
                     </div>
                 </div>
                 
              </div>
          </div>
          
          <div class="people-navigation">
             <div class="pagination-pill">
               <button onclick="prevMember()" class="nav-arrow"><i class="fa-solid fa-chevron-left"></i></button>
               <span id="carousel-counter">1 / </span>
               <button onclick="nextMember()" class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></button>
             </div>
             <button class="btn btn-primary" style="margin-left: 1rem;" onclick="openDetailView()">View Details</button>
          </div>
        </div>

      </div>

    </div>
  </section>

  <!-- Full-Screen Detail View Overlay -->
  <div class="people-detail-view" id="people-detail-view">
     <div class="detail-split">
        <div class="detail-photo" id="detail-photo-container">
           <!-- Photo placeholder -->
        </div>
        <div class="detail-content">
           <button class="back-link" onclick="closeDetailView()">
             <i class="fa-solid fa-arrow-left"></i> Back to Team
           </button>
           <h1 class="detail-name" id="detail-name">Name</h1>
           <p class="detail-title" id="detail-title">Title</p>
           <div class="detail-bio" id="detail-bio">
              Bio goes here
           </div>
        </div>
     </div>
  </div>

  <script>
    const teamData = ;
    let currentIndex = 0;

    function updateActiveMember(index) {
        currentIndex = index;
        const member = teamData[index];
        
        // Update photo
        const photoContainer = document.getElementById('active-person-photo');
        photoContainer.innerHTML = `<div class="avatar-placeholder-large" style="background-color: #f8f9fa; color: var(--color-brand-red); font-size: 5rem;">${member.initials}</div>`;
        
        // Update info with subtle animation
        const infoContainer = document.getElementById('active-person-info');
        infoContainer.style.opacity = '0';
        infoContainer.style.transform = 'translateY(10px)';
        
        setTimeout(() => {
            document.querySelector('.active-name').textContent = member.name;
            document.querySelector('.active-title').textContent = member.title;
            infoContainer.style.opacity = '1';
            infoContainer.style.transform = 'translateY(0)';
        }, 300);

        // Update thumbnails
        document.querySelectorAll('.people-thumbnail').forEach((thumb, i) => {
            if (i === index) {
                thumb.classList.add('active');
            } else {
                thumb.classList.remove('active');
            }
        });
        
        // Update counter
        document.getElementById('carousel-counter').textContent = `${index + 1} / ${teamData.length}`;
        
        // Scroll track
        const track = document.getElementById('people-track');
        if (index > 2) {
            track.style.transform = `translateX(-${(index - 2) * 140}px)`;
        } else {
            track.style.transform = `translateX(0)`;
        }
    }

    function selectTeamMember(index) {
        updateActiveMember(index);
    }

    function nextMember() {
        let newIndex = currentIndex + 1;
        if (newIndex >= teamData.length) newIndex = 0;
        updateActiveMember(newIndex);
    }

    function prevMember() {
        let newIndex = currentIndex - 1;
        if (newIndex < 0) newIndex = teamData.length - 1;
        updateActiveMember(newIndex);
    }
    
    function openDetailView() {
        const member = teamData[currentIndex];
        const detailView = document.getElementById('people-detail-view');
        
        // Populate data
        document.getElementById('detail-photo-container').innerHTML = `<div class="avatar-placeholder-detail" style="background-color: #f8f9fa; color: var(--color-brand-red); font-size: 8rem;">${member.initials}</div>`;
        document.getElementById('detail-name').textContent = member.name;
        document.getElementById('detail-title').textContent = member.title;
        document.getElementById('detail-bio').innerHTML = `<p>${member.bio}</p>`;
        
        detailView.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    
    function closeDetailView() {
        const detailView = document.getElementById('people-detail-view');
        detailView.classList.remove('open');
        document.body.style.overflow = '';
    }

    // Initialize first member
    document.addEventListener('DOMContentLoaded', () => {
        updateActiveMember(0);
    });
  </script>

  <!-- Shared Footer -->
  <div id="shared-footer"></div>
<div id="shared-footer"></div>
  <script src="includes.js"></script>
</body>
</html>
