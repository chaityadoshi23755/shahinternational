<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <div id="shared-header"></div>
    <section class="tech-directory-header reveal">
    <div class="container">
      <h1>Our Clients</h1>
      <ol class="breadcrumb" style="padding-left: 0;"><li><a href="index.html">Home</a></li><li>Our Clients</li></ol>
    </div>
  </section>
  <section class="page-content">
    <div class="container">

      
      
      <style>
        .clients-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 1.5rem;
          margin-top: 3rem;
          margin-bottom: 5rem;
        }
        @media (max-width: 1024px) { .clients-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .clients-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .clients-grid { grid-template-columns: repeat(1, 1fr); } }

        .client-tile-container {
          position: relative;
          height: 180px;
          background-color: #ffffff;
          border: 1px solid rgba(0,0,0,0.05);
          border-radius: 16px;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .client-tile-container:hover {
          transform: translateY(-5px);
          box-shadow: 0 15px 35px rgba(226,49,55,0.1);
          border-color: rgba(226,49,55,0.2);
        }
        .client-tile-logo {
          max-width: 130px;
          max-height: 60px;
          object-fit: contain;
          margin: 0 auto;
          filter: grayscale(100%) opacity(0.7);
          transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
          position: relative;
          z-index: 5;
        }
        .client-tile-container:hover .client-tile-logo {
          filter: grayscale(0%) opacity(1);
          transform: scale(1.05);
        }
      </style>
      
      <div class="clients-grid">

        <div class="client-tile-container reveal">
          <div class="principal-tile-hover-sweep"></div>
          <div class="principal-tile-pattern"></div>

        </div>
        <div class="client-tile-container reveal">

        </div>
        <div class="client-tile-container reveal">

        <div class="client-tile-container reveal">

        <div class="client-tile-container reveal">
