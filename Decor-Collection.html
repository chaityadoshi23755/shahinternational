<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Décor Collection | Shah International</title>
  <meta name="description" content="Explore our full range of premium decorative surfaces — woodgrains, stone & marble, unique colors and fabrics.">
  <link rel="shortcut icon" href="sites/default/files/favicon_v3_2024_0.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=2026080601">
</head>
<body>
  <div id="shared-header"></div>
<style>
.decor-hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; margin-top: 3rem; }
@media(max-width:900px){ .decor-hub-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; } }
@media(max-width:500px){ .decor-hub-grid { grid-template-columns: 1fr; } }
.category-tile { position: relative; border-radius: 2px; overflow: hidden; text-decoration: none; display: block; aspect-ratio: 4/5; background: #111; }
.category-tile img { width:100%; height:100%; object-fit:cover; display:block; transition: transform 0.5s ease, filter 0.4s ease; filter: brightness(0.7); }
.category-tile:hover img { transform: scale(1.06); filter: brightness(0.5); }
.category-tile-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 1.5rem 1.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: #fff; }
.category-tile-label h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 500; margin: 0 0 0.25rem; letter-spacing: 0.05em; }
.category-tile-label span { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.category-tile-arrow { position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.8rem; transition: background 0.3s; }
.category-tile:hover .category-tile-arrow { background: var(--color-brand-red); }
</style>

<section class="page-banner">
  <img src="sites/default/files/2018-12/about.jpg" alt="Décor Collection" class="page-banner-bg">
  <div class="page-banner-overlay"></div>
  <div class="page-banner-content">
    <h1>Décor Collection</h1>
    <ol class="breadcrumb"><li><a href=""><i class="fa-solid fa-house" style="font-size:0.9em;"></i></a></li><li>Décor Collection</li></ol>
  </div>
</section>

<section class="page-content">
  <div class="container">
    <p style="color:#666;font-size:1rem;margin-bottom:0.5rem;letter-spacing:0.04em;">Choose a category to explore our range of premium décor surfaces.</p>
    <div class="decor-hub-grid">

      
      <a href="" class="category-tile">
        <img src="" alt="" loading="lazy">
        <div class="category-tile-arrow"><i class="fa-solid fa-arrow-right"></i></div>
        <div class="category-tile-label">
          <h3></h3>
          <span></span>
        </div>
      </a>
      

    </div>
  </div>
</section>
<div id="shared-footer"></div>
  <script src="includes.js?v=2026080601"></script>
</body></html>
